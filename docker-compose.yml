# GoBeyond: docker compose up -d --build
#   API            http://localhost:5000 (Swagger: /swagger)
#   Mailpit (SMTP) http://localhost:8025
#   RabbitMQ UI    http://localhost:15672
# Aplikacijska konfiguracija je u appsettings.Shared.json; ovdje se pregazi samo ono što zavisi od
# Docker mreže (host imena servisa). Opcionalni .env (vidi .env.example) nosi Stripe TEST ključeve.
name: gobeyond

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:-GoBeyondDemo!210020}
    ports:
      - '1433:1433'
    volumes:
      - gobeyond-sqldata:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-gobeyond}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-GoBeyondDemoRabbit}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - gobeyond-rabbitdata:/var/lib/rabbitmq
    healthcheck:
      # healthy tek kad AMQP port (5672) prima konekcije
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: GoBeyond.API/GoBeyond.API/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ConnectionStrings__MainDb: 'Server=sqlserver,1433;Database=210020;User Id=sa;Password=${SQL_PASSWORD:-GoBeyondDemo!210020};TrustServerCertificate=True'
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USERNAME:-gobeyond}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-GoBeyondDemoRabbit}
    ports:
      - '5000:8080'
    volumes:
      - gobeyond-uploads:/app/wwwroot/uploads
      - gobeyond-private-files:/app/private-files
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/health > /dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  email-consumer:
    build:
      context: .
      dockerfile: GoBeyond.API/GoBeyond.EmailConsumer/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USERNAME:-gobeyond}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-GoBeyondDemoRabbit}
      # Mailpit je podrazumijevano (bezbjedno, sve ostaje na mašini); .env može postaviti Smtp__Host/Smtp__Port
      # (npr. na Gmail) i onda ove vrijednosti pobjeđuju - vidi .env.example.
      Smtp__Host: ${Smtp__Host:-mailpit}
      Smtp__Port: ${Smtp__Port:-1025}
      # Fajl sa ključevima poslanih emailova (idempotencija kod redelivery-a nakon pada - vidi SentMessageIdStore
      # i EmailIdempotencyKey; ključ NIJE sam outbox Id, koji se restartuje od 1 kad se baza resetuje) na
      # imenovanom volume-u ispod, da preživi restart/recreate kontejnera. Apsolutna putanja - ne ide u repo.
      Smtp__SentMessageIdsFilePath: /data/gobeyond-consumer-sent-ids.txt
    volumes:
      - gobeyond-email-consumer-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # Worker osvježava ovaj fajl svakih 15 s dok je consumer stvarno registrovan kod brokera.
      test: ['CMD-SHELL', 'find /tmp/gobeyond-consumer.alive -mmin -1 | grep -q .']
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  gobeyond-sqldata:
  gobeyond-rabbitdata:
  gobeyond-uploads:
  gobeyond-private-files:
  gobeyond-email-consumer-data:
